services:
  api:
    build: ./api
    # Sin root: corre con el uid/gid del duenio de ./data (por defecto 1000)
    user: "${APP_UID:-1000}:${APP_GID:-1000}"
    ports:
      - "5000:5000"
    environment:
      - AGENT_TOKEN=${AGENT_TOKEN:?Definir AGENT_TOKEN en el archivo .env}
    volumes:
      - ./data:/app/data
    restart: unless-stopped
